# Glimmer Configuration (example)
#
# Copy this file to config.toml and fill in your real values. config.toml is
# gitignored so secrets never get committed. Every field below has a safe
# default in config.Load() EXCEPT admin.password_hash, which is required.

[server]
# Address to listen on. Empty = all interfaces. Set to "127.0.0.1" when a
# reverse proxy on the same machine (nginx, Caddy) fronts Glimmer, so the app
# cannot be reached around the proxy.
host = ""
port = 8888
base_url = "http://localhost:8888"
read_timeout = "5s"
write_timeout = "10s"
# Only enable if behind a trusted reverse proxy that sets X-Forwarded-For.
# When false, the real connection IP is used for rate limiting (cannot be spoofed).
trust_proxy = false
# Number of trusted proxies in front of Glimmer (only used when trust_proxy is
# true). The client IP is read that many entries from the RIGHT of
# X-Forwarded-For — entries further left are client-supplied and spoofable.
# 1 = a single proxy (nginx, or Cloudflare straight to the app);
# 2 = Cloudflare -> nginx -> Glimmer.
proxy_hops = 1
# Maximum number of in-flight HTTP requests before returning 503. Tune down on
# very small hardware (e.g. RPi Zero) to bound memory/CPU use.
max_concurrent = 64

[admin]
username = "admin"
# REQUIRED — the server refuses to start without this.
# Generate a hash: ./glimmer --hash-password "your-password"
password_hash = ""
session_hours = 24

[mcp]
enabled = false
# The administrator's key: authenticates POST /mcp and the REST link API
# (/api/links) with access to every link.
api_key = ""

# Keys for other applications that use the REST link API. Each application can
# only see and change the links it created itself, and cannot use /mcp.
# Generate a key with: openssl rand -hex 24
# [[api.keys]]
# name = "solis"
# key  = ""

[database]
path = "./data/urls.db"

[slugs]
length = 7

[upload]
dir = "./data/uploads"
max_size_mb = 50
